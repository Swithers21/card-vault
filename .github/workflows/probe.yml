name: One-off data probe (temporary)
on:
  push:
    branches: [probe-ocg-market]
    paths: [probe.py, .github/workflows/probe.yml]
permissions: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 probe.py
      - run: |
          git config user.name "probe"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add probe-out
          git commit -m "probe results" -q
          git push -q
