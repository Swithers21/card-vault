name: Daily TCGplayer prices

# Every evening this downloads the day's TCGplayer prices (through TCGCSV) for the Card Vault website and
# publishes the website with GitHub Pages. It also publishes right away whenever the website's files change.
# "Run workflow" on the Actions tab runs it by hand.
# Going back: Actions > Daily TCGplayer prices > Run workflow, and put an earlier commit's number in "ref"
# (find it under the repository's Commits). It publishes that version of the website with today's prices.
# Before the first run: Settings > Pages > Build and deployment > Source: "GitHub Actions".

on:
  schedule:
    - cron: "40 21 * * *"   # 21:40 UTC: 5:40 PM New York time in summer, 4:40 PM in winter (TCGCSV refreshes before that)
    - cron: "10 4 * * *"    # and again overnight, in case TCGCSV was late or down (if nothing changed, it just republishes)
  workflow_dispatch:
    inputs:
      ref:
        description: "Go back to an earlier version: a commit's code (from the repository's history) to publish with today's prices. Leave empty for the latest."
        required: false
        default: ""
  push:
    branches: [main]

permissions: {}   # each job gets only what it needs (below)

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04   # (pinned: GitHub moves "ubuntu-latest" to a new release now and then; move this on purpose)
    permissions:
      contents: read
    steps:
      - name: Note when this run started (for the update status)
        run: echo "RUN_STARTED=$(date -u +%FT%TZ)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}   # (empty: the latest; or an earlier commit, to go back to how the website was then)
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # The tests (tests/ folder) check the readers of the grading companies' pages, the ban lists and the pre-publish
      # check. If one fails the website isn't touched: what is published stays as it was.
      - name: Run the tests
        if: hashFiles('tests/*.py') != ''   # (an earlier version being put back may not have them)
        run: python -m unittest discover -s tests -v

      - name: Bring back yesterday's card lists and earlier prices
        uses: actions/cache/restore@v6
        with:
          path: |
            tcgplayer-cache
            tcgplayer-data.js
            tcgplayer-data-version.js
          key: tcgplayer-${{ github.run_id }}
          restore-keys: tcgplayer-

      - name: Download today's TCGplayer prices
        id: tcg
        continue-on-error: true   # if TCGCSV is down, the website keeps the last prices
        env:
          CARDVAULT_PAUSE: "0.2"
        run: python update_tcgplayer_data.py

      - name: Keep the card lists and prices for tomorrow
        uses: actions/cache/save@v6
        with:
          path: |
            tcgplayer-cache
            tcgplayer-data.js
            tcgplayer-data-version.js
          key: tcgplayer-${{ github.run_id }}

      # Pictures of cards TCGplayer has no photo of yet (new sets, promos), from YGOPRODeck. YGOPRODeck asks apps to
      # download each picture once and keep their own copy, so the folder is kept between runs.
      - name: Bring back the card pictures kept so far
        uses: actions/cache/restore@v6
        with:
          path: card-images
          key: card-images-${{ github.run_id }}
          restore-keys: card-images-

      - name: Download pictures of cards TCGplayer has no photo of
        continue-on-error: true   # the website then shows a drawn stand-in for those cards
        run: python stand_in_images.py

      - name: Keep the card pictures for tomorrow
        uses: actions/cache/save@v6
        with:
          path: card-images
          key: card-images-${{ github.run_id }}

      # Japanese and Korean sets and cards: Yugipedia (sets and English card names), BIGWEB (Japanese prices and
      # photos) and Bunjang (Korean prices and boxes), read side by side at a gentle pace, up to 25 minutes a run.
      # What was looked up is kept between runs (with each day's prices), so each set is looked up again only now and
      # then (new sets daily, old ones weekly); the first runs fill the lists in, newest sets first.
      - name: Bring back the Japanese and Korean card data kept so far
        uses: actions/cache/restore@v6
        with:
          path: |
            ocg-cache
            ocg-market.js
            ocg-cards.js
            ocg-history
          key: ocg-${{ github.run_id }}
          restore-keys: ocg-

      - name: Japanese and Korean sets, cards, prices and boxes
        id: ocg
        continue-on-error: true   # the website then keeps the last ones
        timeout-minutes: 32
        env:
          CARDVAULT_OCG_BUDGET: "1500"
        run: |
          python ocg_market.py | tee ocg.log
          echo "::notice title=Japanese and Korean cards::$(tail -n 1 ocg.log)"

      # The grading companies' price lists (PSA, Beckett, CGC, SGC, TAG), read from their own pages once a day.
      - name: Grading companies' fees
        id: fees
        continue-on-error: true   # the website then uses the last ones it read, or its built-in list
        timeout-minutes: 8
        run: |
          # (so a page sent compressed with brotli or zstd, as PSA's can be, is unpacked; without them gzip and plain pages still read)
          python -m pip install --quiet --disable-pip-version-check brotli zstandard || true
          python grading_fees.py

      # The Forbidden & Limited lists (TCG and OCG), from YGOPRODeck, with the changes noticed night by night.
      - name: Ban lists
        id: ban
        continue-on-error: true   # the website then shows the last ones read
        timeout-minutes: 4
        run: |
          python banlist.py | tee ban.log
          echo "::notice title=Ban lists::$(tail -n 1 ban.log)"

      # Phone alerts without the PC: only once you've added the CARDVAULT_ALERTS secret (Card Vault's Settings >
      # Phone alerts shows it). It reads the locked alerts file the website keeps in your Google Drive.
      - name: Phone alerts
        id: alerts
        continue-on-error: true   # (never in the way of publishing the prices)
        timeout-minutes: 5
        env:
          CARDVAULT_ALERTS: ${{ secrets.CARDVAULT_ALERTS }}
        run: |
          if [ -n "$CARDVAULT_ALERTS" ]; then python -m pip install --quiet --disable-pip-version-check cryptography; fi
          python cloud_alerts.py | tee alerts.log
          echo "::notice title=Phone alerts::$(tail -n 1 alerts.log)"

      # How it all went: the website shows it in Settings, with a notice when something broke.
      - name: Note how tonight's update went
        if: always()
        continue-on-error: true   # (never in the way of publishing the prices)
        env:
          TCG_OUTCOME: ${{ steps.tcg.outcome }}
          OCG_OUTCOME: ${{ steps.ocg.outcome }}
          FEES_OUTCOME: ${{ steps.fees.outcome }}
          BAN_OUTCOME: ${{ steps.ban.outcome }}
          ALERTS_OUTCOME: ${{ steps.alerts.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python site_status.py

      - name: Keep the Japanese and Korean card data for tomorrow
        uses: actions/cache/save@v6
        with:
          path: |
            ocg-cache
            ocg-market.js
            ocg-cards.js
            ocg-history
          key: ocg-${{ github.run_id }}

      - name: Put the website together
        run: |
          mkdir -p _site/icons _site/card-images
          # (each if it's there: an earlier version being put back may not have all of them; the look-over below catches a missing one)
          for f in index.html app.css app.js config.js manifest.webmanifest oauth.html share.html sw.js; do if [ -f "$f" ]; then cp "$f" _site/; fi; done
          cp icons/*.png _site/icons/
          if [ -f tcgplayer-data.js ]; then cp tcgplayer-data.js tcgplayer-data-version.js _site/; fi
          if [ -f ocg-market.js ]; then cp ocg-market.js _site/; fi
          if [ -f ocg-cards.js ]; then cp ocg-cards.js _site/; fi
          if [ ! -f grading-fees.js ]; then python grading_fees.py --from-cache || true; fi
          if [ ! -f banlist.js ]; then python banlist.py --from-cache || true; fi
          for f in grading-fees.json grading-fees.js banlist.json banlist.js update-status.json update-status.js; do if [ -f "$f" ]; then cp "$f" _site/; fi; done
          if ls ocg-history/*.json >/dev/null 2>&1; then mkdir -p _site/ocg-history && cp ocg-history/*.json _site/ocg-history/; fi
          if ls card-images/*.jpg >/dev/null 2>&1; then cp card-images/*.jpg _site/card-images/; fi
          echo "$(ls _site/card-images | wc -l) card pictures"
          python card_history.py _site/history || echo "No price history files this time."
          ls -la _site

      # Looks the finished website over (files all there, the program has no typing errors, the prices file is real and
      # hasn't shrunk). A real problem stops the run here: nothing is published and the site stays as it is.
      - name: Bring back the counts from the last published website
        uses: actions/cache/restore@v6
        with:
          path: publish-counts.json
          key: published-${{ github.run_id }}
          restore-keys: published-

      - name: Look the website over before publishing
        if: hashFiles('check_site.py') != ''
        run: python check_site.py _site --counts publish-counts.json --save

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Keep the counts of what is being published
        uses: actions/cache/save@v6
        with:
          path: publish-counts.json
          key: published-${{ github.run_id }}

  deploy:
    needs: build
    runs-on: ubuntu-24.04   # (pinned: GitHub moves "ubuntu-latest" to a new release now and then; move this on purpose)
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5

  # GitHub pauses scheduled workflows in a repository with no new commits for 60 days.
  # A one-line note twice a month keeps the daily prices coming.
  keep-schedule-running:
    needs: deploy
    if: github.event_name == 'schedule' && github.event.schedule == '40 21 * * *'
    runs-on: ubuntu-24.04   # (pinned: GitHub moves "ubuntu-latest" to a new release now and then; move this on purpose)
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Note that the daily prices are running (on the 1st and 15th)
        run: |
          day=$(date -u +%d)
          if [ "$day" != "01" ] && [ "$day" != "15" ]; then echo "Not today."; exit 0; fi
          date -u +"Prices last updated %Y-%m-%d" > .github/last-price-update.txt
          git config user.name "Card Vault daily prices"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/last-price-update.txt
          if git diff --cached --quiet; then echo "Already noted today."; exit 0; fi
          git commit -m "Daily prices are running ($(date -u +%F))"
          git push

  # If a scheduled night breaks, say so where it is noticed: an issue in this repository (GitHub emails you about it),
  # and close that issue again when a night goes through. (Needs Issues switched on for the repository.)
  tell-me-if-it-broke:
    needs: [build, deploy]
    if: always() && github.event_name == 'schedule'
    runs-on: ubuntu-24.04   # (pinned: GitHub moves "ubuntu-latest" to a new release now and then; move this on purpose)
    permissions:
      issues: write
    steps:
      - name: Open or close the "update didn't publish" issue
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD: ${{ needs.build.result }}
          DEPLOY: ${{ needs.deploy.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Card Vault's nightly update didn't publish"
          open=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$title\"" --json number --jq '.[0].number // empty')
          if [ "$BUILD" = "success" ] && [ "$DEPLOY" = "success" ]; then
            if [ -n "$open" ]; then gh issue close "$open" --repo "$GITHUB_REPOSITORY" --comment "Tonight's update published fine ($RUN_URL)."; fi
            exit 0
          fi
          body="Tonight's run did not publish (building: $BUILD, publishing: $DEPLOY). The website you already have is still up, with the last prices. Details: $RUN_URL"
          if [ -n "$open" ]; then gh issue comment "$open" --repo "$GITHUB_REPOSITORY" --body "$body"; else gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"; fi
