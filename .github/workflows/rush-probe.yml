name: Card Vault probe (one time)
on:
  push:
    branches: [rush-probe]
    paths: [probe/probe_rush.py, .github/workflows/rush-probe.yml]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python probe/probe_rush.py
      - name: Save what it found on this branch
        run: |
          git config user.name "Card Vault probe"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add probe/out.json probe/out2.json 2>/dev/null || true; git add probe
          git commit -m "Rush Duel probe results"
          git push
